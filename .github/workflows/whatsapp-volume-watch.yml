# Early warning for the QStash daily cap.
#
# Every WhatsApp webhook event — inbound and the echo of Paula's own replies —
# costs one QStash publish, and the plan allows 1000 a day. On 2026-09-21 the
# day closed at 1104: the quota ran out mid-afternoon and real customers'
# messages silently stopped being processed for hours. Nobody noticed until
# the next day.
#
# The count runs through the day so a spike is caught while there is still
# quota left to protect. Since 2026-10-23 it is a Vercel cron
# (pdepapel-admin/vercel.json, 02:00, 14:00, 18:00 and 22:00 UTC = 21:00, 09:00,
# 13:00 and 17:00 Bogota): GitHub skipped some of these slots. This workflow is
# manual only; never add a schedule back, or the count runs twice.
name: WhatsApp webhook volume watch

on:
  workflow_dispatch:

jobs:
  whatsapp-webhook-volume:
    name: WhatsApp webhook daily volume
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # The endpoint answers 200 whether or not the threshold was crossed; the
      # warning surfaces in the panel's «Sistemas» card, not in CI. A red run
      # here means the check itself could not run.
      - name: Check today's WhatsApp webhook event volume
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/whatsapp-webhook-volume"
