name: Admin scheduled tasks

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single job (all = every daily job). db-health runs only the MySQL review; notification-retry resends failed order emails only; mercado-libre-health runs only the Mercado Libre review (manual only: QStash runs it daily; it emails only new or changed alerts). abc-classification, customer-reactivation and bank-transfer-review are switched off: manual dry runs only, they report counts and change nothing."
        required: false
        default: all
        type: choice
        options:
          - all
          - notification-retry
          - mercado-libre-health
          - db-health
          - abc-classification
          - customer-reactivation
          - bank-transfer-review

jobs:
  # The daily run is a QStash schedule (lib/mercadolibre/queue.ts,
  # ensureMercadoLibreHealthSchedule): GitHub started this one hours late.
  # This job stays for manual runs only; the run lock and alert fingerprints
  # keep a manual run on the same day from emailing twice.
  mercado-libre-health:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'mercado-libre-health') }}
    name: Mercado Libre daily health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Emails only alerts that are new or changed since the last notice and
      # not marked as reviewed; a second run the same day sends nothing
      # (lib/mercadolibre/health-alerts.ts, #8). The JSON response shows
      # `issues` (open today) and `notified` (in this run's email).
      - name: Request Mercado Libre health review
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/mercadolibre-health"

  google-merchant-feed:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' }}
    name: Google Merchant feed refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Rebuilds every store's hosted feed into the cache (read-only on the
      # catalog). Vercel's plan allows two crons and both are taken, so this
      # runs here at 13:00 UTC (8:00 a. m. Colombia); schedule the Merchant
      # Center fetch after 8:30 a. m.
      - name: Refresh Google Merchant feed
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/google-merchant-feed"

  image-health:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' }}
    name: Product image health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Marks product images whose file no longer exists at Cloudinary so the
      # panel lists them under Productos › «Imagen rota» and on Inicio.
      - name: Check product images
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/image-health"

  whatsapp-webhook-retention:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' }}
    name: WhatsApp webhook event retention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      - name: Prune processed WhatsApp webhook events older than 30 days
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/whatsapp-webhook-retention"

  payment-webhook-retention:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' }}
    name: Payment webhook event retention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Only settled events (processed or ignored) older than 90 days go;
      # rejected and failed ones are kept, they are the audit trail.
      - name: Prune settled Bold/Wompi webhook events older than 90 days
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/payment-webhook-retention"

  notification-retry:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'notification-retry' }}
    name: Order email retry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Resends order emails that failed in the last 48 h (FailedNotification),
      # at most 4 attempts per order + kind + recipient, each row claimed
      # atomically so two runs never send twice. EnvioClick guides are never
      # retried here: they are paid when created (lib/notification-retry.ts).
      - name: Retry failed order emails
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/notification-retry"

  db-health:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'db-health' }}
    name: MySQL health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Flags memory or connections above 70 %, a MySQL restart in the last
      # 24 h (how an overnight OOM shows up), WhatsApp webhooks still waiting
      # to be saved and, with RAILWAY_METRICS_TOKEN in Vercel, the container
      # above 2 GB or growing 300 MB in a day (that one also emails). A warning
      # turns «Sistemas» red (lib/db-health.ts).
      - name: Review MySQL memory and connections
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/db-health"

  gift-card-holds:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' }}
    name: Gift card hold release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Releases gift-card holds of cancelled orders and of orders unpaid for
      # more than seven days (lib/gift-cards.ts releaseExpiredGiftCardHolds).
      # A missed day only keeps a hold a day longer: paying late re-holds,
      # so no balance is ever spent twice.
      - name: Release expired gift-card holds
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/gift-card-holds"

  # Switched off in lib/scheduled-jobs.ts (SCHEDULED_JOBS) until Christian
  # approves it: manual only, and the route refuses mode=apply while off.
  # The response carries counts only, never emails or order numbers.
  abc-classification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only == 'abc-classification' }}
    name: ABC classification (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Counts how many products would change ABC class (last 180 days of profit).
      - name: Dry run
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/abc-classification?mode=dry-run"

  # Switched off in lib/scheduled-jobs.ts (SCHEDULED_JOBS) until Christian
  # approves it: manual only, and the route refuses mode=apply while off.
  # The response carries counts only, never emails or order numbers.
  customer-reactivation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only == 'customer-reactivation' }}
    name: Customer reactivation (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Counts the customers at 90 days without buying who would get the reactivation email and coupon.
      - name: Dry run
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/customer-reactivation?mode=dry-run"

  # Switched off in lib/scheduled-jobs.ts (SCHEDULED_JOBS) until Christian
  # approves it: manual only, and the route refuses mode=apply while off.
  # The response carries counts only, never emails or order numbers.
  bank-transfer-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only == 'bank-transfer-review' }}
    name: Bank transfer review (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_BASE_URL: https://admin.papeleriapdepapel.com
      ADMIN_CRON_SECRET: ${{ secrets.PDEPAPEL_ADMIN_CRON_SECRET }}
    steps:
      - name: Verify protected secret
        run: test -n "$ADMIN_CRON_SECRET"
      # Counts unpaid bank-transfer orders older than 48 h that would get the review note.
      - name: Dry run
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_CRON_SECRET" \
            "$ADMIN_BASE_URL/api/cron/bank-transfer-review?mode=dry-run"
