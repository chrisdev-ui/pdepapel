name: Public health checks

# Corre semanalmente y a mano. Antes también corría tras cada despliegue de
# producción: con ~50 pushes por semana eran 21 pruebas de navegador contra la
# tienda en cada uno, y Vercel cobra la CPU de esos renders (2026-09-10, 301 %
# del plan gratuito). El chequeo tras desplegar lo cubre la revisión manual.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  public-routes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdepapel-store
    env:
      E2E_BASE_URL: https://papeleriapdepapel.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: pdepapel-store/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Marcas: los datos salen de la API pública (tests/e2e/brands/discover-brands.ts).
      # La marca oculta no se puede descubrir: su bloque corre solo si existen
      # las variables del repositorio E2E_HIDDEN_BRAND_*.
      - run: npm run test:e2e:brands
        if: ${{ !cancelled() }}
        env:
          E2E_HIDDEN_BRAND_SLUG: ${{ vars.E2E_HIDDEN_BRAND_SLUG }}
          E2E_HIDDEN_BRAND_NAME: ${{ vars.E2E_HIDDEN_BRAND_NAME }}
          E2E_HIDDEN_BRAND_PRODUCT_SLUG: ${{ vars.E2E_HIDDEN_BRAND_PRODUCT_SLUG }}
